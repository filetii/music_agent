[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música (Artefact AI Engineer challenge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the evals package lives at the project root
